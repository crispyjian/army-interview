{id:'career',title:'2017~2023 · 행정·복지 업무 보조',where:'제출 자기소개서 · PDF 3쪽',text:'약 7년 동안 노인, 아동·청소년, 수급자, 장애인 관련 민원·행정업무를 보조했습니다. 기초연금, 각종 수당, 보육료, 유아학비, 양육수당 신청을 안내하고 신청 업무를 맡았습니다. 쌀 지원, 문화누리카드, 가스·전기요금 할인 신청, 신청 내용 전산등록, 증명서 발급, 서류 정리와 자료 취합을 수행했습니다.'},
{id:'mail',title:'2024 · 공문·우편물·전화응대',where:'제출 자기소개서 · PDF 3쪽',text:'공문과 우편물을 수신·접수하고 관리했습니다. 공문을 정해진 문서번호순으로 분류해 서류철에 보관하고 관련 엑셀파일을 정리했습니다. 전화응대도 맡았습니다. 별도 접수대장의 항목·형식과 사용한 엑셀 세부 기능은 미확인입니다.'},
{id:'program',title:'2025 · 행정지원·프로그램 운영보조',where:'제출 자기소개서 · PDF 3쪽',text:'공문과 우편물 수신·접수 및 관리, 프로그램 운영보조를 맡았습니다. 엑셀 참여자 명단, 참석 확인, 안내문자 발송·예약, 달력 일정 기록, 준비물과 장소 준비, 참여자 현장 안내, 활동 사진 촬영을 했습니다.'},
{id:'case',title:'민원 안내와 담당자 부재 사례',where:'제출 자기소개서 · PDF 3~4쪽',text:'담당자가 부재할 때 문제 원인을 정확히 알 수 없는 민원은 단정하지 않았습니다. 별도로 문의한, 평소 보조하던 다른 정상 진행 민원의 처리 단계와 통상적인 소요기간을 설명했습니다. 안내한 시기에 결과를 확인할 수 있었고 이후 직접 찾아오는 문의가 늘었습니다. 판단이 어려운 부분은 대직자와 상의했습니다.'},

q('angry',2,'민원인이 강하게 항의하면 어떻게 하겠습니까?','먼저 어떤 점이 불편하셨는지 듣겠습니다. 제가 확인한 사실과 확인이 필요한 부분을 구분해서 설명하겠습니다. 제 권한으로 결정할 수 없는 요청은 담당자나 상급자에게 상황을 전달하겠습니다.','불편 사항 청취·확인된 사실 안내 예정','담당자·상급자에게 판단 요청 예정','동일 항의 상황을 해결한 실제 사례 미확인',['case','plan'],[['무조건 요구를 들어주겠습니까?','요청은 충분히 듣되, 정해진 절차와 제 업무 범위 안에서 대응하겠습니다.'],['본인의 안내가 잘못됐다면요?','잘못 안내한 부분을 인정하고 정확한 내용을 확인해 바로잡겠습니다.']],'상황형');
q('welfare',3,'복지 신청 업무에서 직접 맡은 일은 무엇입니까?','기초연금과 각종 수당, 보육료와 유아학비, 양육수당의 신청 안내와 신청 업무를 맡았습니다. 수급자 관련 쌀 지원과 문화누리카드, 가스·전기요금 할인 신청도 담당했습니다. 신청 내용 전산등록과 증명서 발급도 했습니다.','신청 안내·신청 업무·전산등록·증명서 발급','심사·결정 권한과 본인 신청 업무를 구분','최종 자격 심사·승인 권한 미확인',['career'],[['지원 대상 여부도 최종 결정했습니까?','제가 맡은 신청 안내와 전산등록 등의 업무를 말씀드린 것입니다. 최종 심사 권한이 있었다고 말씀드리지는 않겠습니다.'],['여러 제도는 어떻게 익혔습니까?','실제 업무를 보조하면서 처리 방법과 순서를 익히고, 모르는 부분은 확인했습니다.']]);
q('cert',3,'증명서 발급 경험이 있습니까?','행정·복지 업무를 보조하면서 증명서 발급을 맡았습니다. 신청 안내와 전산등록 등 민원업무도 함께 했습니다. 구체적인 발급 종류와 당시의 세부 절차는 확인 후 정확히 말씀드리겠습니다.','증명서 발급','권한·구체적 절차가 불분명한 부분은 확인','증명서 종류·시스템명·세부 발급 절차 미확인',['career'],[['어떤 시스템을 썼습니까?','시스템의 정확한 명칭은 확인이 필요합니다. 추측해서 말씀드리지 않겠습니다.'],['누구에게나 발급해 주면 됩니까?','아닙니다. 실제 담당 업무의 확인 요건과 발급 절차를 먼저 익히고 따르겠습니다.']]);
q('eligibility',3,'신청인이 지원 대상인지 확답을 요구하면요?','제가 확인할 수 있는 신청 방법과 필요한 절차를 먼저 안내하겠습니다. 최종 대상 여부처럼 담당자의 판단이 필요한 사항은 확인을 요청하겠습니다. 확인되지 않은 결과를 확정해서 말씀드리지 않겠습니다.','신청 방법·절차 안내 예정','담당자에게 대상 판단 확인 예정','최종 심사 권한 미확인',['career','case'],[['경험이 많아도 확답하지 않습니까?','경험이 있어도 제가 결정할 수 없는 부분은 담당자의 확인을 받겠습니다.'],['민원인이 기다리기 싫다고 하면요?','확인이 필요한 이유를 짧게 설명하고, 먼저 할 수 있는 신청 안내를 진행하겠습니다.']],'상황형');
q('excel',4,'엑셀은 어떤 업무에 사용했습니까?','엑셀로 참여자 명단과 업무자료, 공문 관련 파일을 정리했습니다. 업무에서 꾸준히 사용했고 컴퓨터활용능력 2급도 취득했습니다. 실제로 사용한 세부 함수나 기능은 확인된 범위에서 말씀드리겠습니다.','참여자 명단·업무자료·공문 관련 파일 정리','부서 요구 형식과 확인 기준은 임용 후 확인','특정 함수·피벗·매크로 사용 실적 미확인',['mail','program','excel-evidence'],[['어떤 함수를 잘 사용합니까?','실무에서 사용한 함수명은 확인이 필요합니다. 명단과 업무자료를 정리해 온 경험부터 말씀드리겠습니다.'],['자동화한 경험이 있습니까?','자동화 실적은 확인되지 않았습니다. 실제 해온 자료 정리 업무를 중심으로 말씀드리겠습니다.']]);
q('doc',4,'문서 관리에서 신경 쓴 점은 무엇입니까?','공문은 정해진 문서번호순으로 분류해 서류철에 보관했습니다. 관련 엑셀파일과 업무자료도 정리했습니다. 개인정보가 있는 서류는 불필요하게 놓아두지 않고 확인 후 담당자에게 바로 전달했습니다.','문서번호순 정리·파일 관리·서류 전달','개인정보 서류를 담당자에게 전달','보존연한 설정·파기 권한 미확인',['mail','privacy'],[['보존연한도 직접 정했습니까?','제가 직접 정했다고 확인된 내용은 없습니다. 부서의 관리 기준을 확인해 따르겠습니다.'],['전자결재도 해봤습니까?','구체적인 시스템 사용 경험은 확인이 필요합니다. 임용 후 사용하는 시스템부터 배우겠습니다.']]);
q('wrongfile',4,'전달한 엑셀자료에 오류를 발견하면요?','어떤 항목이 잘못되었는지 원자료와 대조하겠습니다. 이미 전달했다면 담당자에게 오류와 영향 범위를 알리고 수정 방법을 확인하겠습니다. 수정본을 보낼 때는 이전 파일과 혼동되지 않도록 확인하겠습니다.','오류 항목·원자료 대조와 수정 예정','담당자에게 오류·영향 범위 보고 예정','실제 오류 수정 사례·수치 미확인',['plan'],[['조용히 고치면 되지 않습니까?','이미 전달된 자료라면 다른 업무에 영향을 줄 수 있어 수정 사실도 함께 알리겠습니다.'],['같은 실수를 줄이려면요?','제출 전에 요청 항목과 날짜·수치를 원자료와 다시 확인하겠습니다.']],'상황형');
q('event',5,'프로그램 운영보조에서 맡은 역할은 무엇입니까?','엑셀로 참여자 명단을 정리하고 참석 여부를 확인했습니다. 안내문자를 발송하고 달력에 일정을 기록했으며 문자는 미리 예약했습니다. 준비물과 장소를 준비하고 진행 중에는 참여자 안내와 활동 사진 촬영을 했습니다.','명단·참석 확인·문자·일정·준비물·장소·현장 안내·촬영','운영 전체 결정과 보조 역할을 구분','프로그램명·규모·예산·총괄 권한 미확인',['program'],[['프로그램을 직접 기획했습니까?','제가 확인해서 말씀드릴 수 있는 역할은 프로그램 운영보조와 행정지원입니다.'],['행사 규모는 어느 정도였습니까?','정확한 참여 인원과 규모는 확인이 필요합니다. 수치를 임의로 말씀드리지 않겠습니다.']]);
q('schedule',5,'여러 프로그램 일정을 어떻게 챙겼습니까?','달력에 일정을 적고 안내문자는 미리 예약했습니다. 참여자 명단과 참석 여부도 확인했습니다. 일정이 다가오기 전에 준비물을 챙기고 장소를 준비했습니다.','달력 일정 기록·문자 예약·사전 준비','일정 변경 시 담당자 확인은 향후 대응','별도 일정관리 앱·자동화 방식 미확인',['program'],[['예약문자를 사용한 이유는 무엇입니까?','여러 프로그램의 일정을 챙기면서 안내가 제때 나가도록 준비하기 위해서였습니다.'],['군에서도 같은 도구를 쓰겠습니까?','기록하고 미리 준비하는 습관은 이어가되, 도구는 부서에서 사용하는 방식에 맞추겠습니다.']]);
q('change',5,'행사 직전에 장소가 바뀐다면요?','변경 내용을 담당자에게 확인하겠습니다. 참여자 안내와 장소 준비 중 무엇을 먼저 해야 하는지 상의하고 제가 맡은 일을 진행하겠습니다. 안내가 필요한 대상에게 정확한 변경 내용을 전달하겠습니다.','변경 안내·현장 준비 예정','담당자에게 변경 사실·우선순위 확인 예정','동일 상황 실제 경험 미확인',['program','plan'],[['혼자서 장소를 바꾸겠습니까?','운영 결정이 필요한 사항은 담당자와 상의하겠습니다.'],['현장에 먼저 온 참여자는요?','확인된 새 장소와 이동 방법을 차분히 안내하고 필요한 사항은 담당자와 공유하겠습니다.']],'상황형');
q('team',6,'동료와 협업했던 경험을 말씀해 주십시오.','담당자가 부재할 때 제가 처리할 수 있는 기본 업무에 대응하고, 판단이 어려운 부분은 대직자와 상의했습니다. 관련 서류는 확인 후 담당자에게 바로 전달했습니다. 제 업무 범위 안에서 처리하고 필요한 내용을 연결하는 것을 중요하게 생각했습니다.','기본 업무 대응·서류 확인 및 전달','대직자와 판단 사항 상의·담당자에게 전달','팀 성과 수치·조직 총괄 실적 미확인',['case','privacy'],[['협업에서 중요한 것은 무엇입니까?','제가 처리할 부분과 다른 사람의 확인이 필요한 부분을 구분하는 것이라고 생각합니다.'],['담당자와 의견이 다르면요?','제가 확인한 사실과 이유를 말씀드리고, 업무 기준과 판단이 필요한 부분을 함께 확인하겠습니다.']]);
q('report',6,'기한을 맞추기 어려울 때 어떻게 하겠습니까?','늦어지는 부분과 남은 일, 마감 기한을 먼저 정리하겠습니다. 기한이 지나기 전에 상급자에게 보고하고 우선순위와 처리 방법을 상의하겠습니다. 조정된 내용에 따라 제가 맡은 일을 진행하겠습니다.','지연 상황·남은 일 정리 예정','기한 전 보고·우선순위 상의 예정','과거 지연 보고 사례 미확인',['plan'],[['완료한 뒤에만 보고하면 안 됩니까?','기한에 영향을 주는 상황은 미리 알려야 필요한 조정을 할 수 있다고 생각합니다.'],['보고는 어떻게 짧게 하겠습니까?','현재 상황, 늦어지는 이유, 남은 일과 필요한 도움 순서로 말씀드리겠습니다.']],'상황형');
q('handover',6,'업무 인수인계는 어떻게 하겠습니까?','처리한 일과 아직 남은 일을 구분해 전달하겠습니다. 답변을 기다리는 사항과 기한이 정해진 일은 관련 자료와 함께 알리겠습니다. 인계받을 때도 진행 상태와 먼저 해야 할 일을 확인하겠습니다.','처리·미처리 사항과 자료 정리 예정','관련 담당자·다음 담당자에게 상태 공유 예정','실제 인수인계 문서 양식 미확인',['plan'],[['구두로만 전달하면 충분합니까?','부서 방식에 맞춰 필요한 내용을 기록하고, 관련 자료도 함께 전달하겠습니다.'],['일부 내용이 기억나지 않으면요?','추측해서 전달하지 않고 기존 자료나 담당자에게 확인하겠습니다.']],'상황형');
q('orders',6,'동시에 여러 업무를 요청받으면요?','각 업무의 기한과 진행 상황을 먼저 확인하겠습니다. 제 판단만으로 우선순위를 바꾸기 어렵다면 담당자나 상급자에게 상황을 알리고 상의하겠습니다. 정해진 순서에 따라 처리하면서 진행 상황을 공유하겠습니다.','기한·업무 상태 정리 예정','담당자·상급자에게 우선순위 상의 예정','실제 동일 상황 사례 미확인',['program','plan'],[['둘 다 급하다고 하면요?','두 업무의 기한과 필요한 시간을 함께 말씀드리고 우선순위를 확인하겠습니다.'],['처리가 늦어지면요?','어느 부분이 늦어지는지와 남은 일을 기한 전에 보고하겠습니다.']],'상황형');
q('security',7,'개인정보 서류를 어떻게 다뤘습니까?','개인정보가 포함된 서류가 여러 사람이 오가는 곳에 불필요하게 놓이지 않도록 주의했습니다. 관련 서류는 확인한 뒤 바로 담당자에게 전달했습니다. 자주 다루는 서류도 개인정보가 담겨 있다는 점을 잊지 않으려고 했습니다.','서류 노출 주의·확인 후 바로 전달','담당자에게 관련 서류 전달','문서 파쇄·접근권한 설정 수행 실적 미확인',['privacy'],[['보안업무를 총괄했습니까?','총괄한 경험을 말씀드리는 것은 아닙니다. 제가 맡은 서류를 주의해서 다룬 경험입니다.'],['군에서는 어떻게 하겠습니까?','부서의 보관·전달·공유 절차를 먼저 익히고 따르겠습니다.']]);

'use strict';
const KEY='calm-interview-v1';
const initial=()=>({schema:1,answers:{},notes:{},flags:{},checks:{},history:[],sessions:[],reviews:{},audits:{},documentText:'',fontLarge:false});
let state=initial(), storageError=false;

let filter={cat:'all',type:'all',search:'',status:'all',origin:'all'}, session=null, editing=null, timerInterval=null, timerStart=null, elapsed=0, targetSeconds=60, toastTimeout=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getQ=id=>QUESTIONS.find(q=>q.id===id);
function validate(d){
 const fail=()=>{throw Error('지원하지 않거나 손상된 백업 형식입니다.');};
 const obj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
 const str=(v,n)=>typeof v==='string'&&v.length<=n;
 const date=v=>str(v,80)&&!Number.isNaN(new Date(v).getTime());
 const answer=v=>obj(v)&&str(v.answer,5000)&&Array.isArray(v.follow)&&v.follow.length===2&&v.follow.every(x=>str(x,2000))&&(v.note===undefined||str(v.note,2000));
 if(!obj(d)||d.schema!==1||!obj(d.answers)||!Array.isArray(d.history)||!Array.isArray(d.sessions))fail();
 const o=initial();
 for(const k of ['answers','notes','flags','checks','reviews','audits']){if(d[k]!==undefined&&!obj(d[k]))fail();o[k]=d[k]||{};for(const id of Object.keys(o[k]))if(!getQ(id))fail();}
 for(const v of Object.values(o.answers))if(!answer(v))fail();
 for(const v of Object.values(o.notes))if(!str(v,2000))fail();
 for(const v of Object.values(o.flags))if(!obj(v)||Object.keys(v).some(k=>!['weak','review'].includes(k)||typeof v[k]!=='boolean'))fail();
 for(const v of Object.values(o.checks))if(!Array.isArray(v)||v.length!==4||v.some(x=>typeof x!=='boolean'))fail();
 for(const v of Object.values(o.reviews))if(!obj(v)||!Number.isSafeInteger(v.count)||v.count<0||!date(v.at))fail();
 for(const v of Object.values(o.audits))if(!obj(v)||!str(v.fingerprint,20000)||!date(v.at))fail();
 if(d.history.length>100||d.sessions.length>100)fail();
 o.history=d.history; o.sessions=d.sessions;
 for(const h of o.history)if(!obj(h)||!getQ(h.id)||!answer(h.before)||!answer(h.after)||!date(h.at)||(h.action!==undefined&&!str(h.action,100)))fail();
 for(const h of o.sessions){if(!obj(h)||!date(h.at)||!Array.isArray(h.items)||h.items.length>QUESTIONS.length)fail();for(const i of h.items)if(!obj(i)||!getQ(i.id)||!Number.isSafeInteger(i.seconds)||i.seconds<0||!Array.isArray(i.checks)||i.checks.length>4||i.checks.some(v=>typeof v!=='boolean'))fail();}
 if(d.documentText!==undefined&&!str(d.documentText,100000))fail();
 o.documentText=d.documentText||'';o.fontLarge=!!d.fontLarge;return o;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageError=false;return true;}catch(e){storageError=true;toast('이 브라우저에 저장하지 못했어요. 백업 파일을 내려받아 주세요.');return false;}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').classList.remove('show'),2600);}
const effective=q=>state.answers[q.id]||{answer:q.answer,follow:q.follow.map(f=>f[1])};
const flag=id=>state.flags[id]||{};
function toggleFlag(id,key){state.flags[id]={...flag(id),[key]:!flag(id)[key]};save();render();toast(flag(id)[key]?(key==='weak'?'부족한 답변으로 표시했어요.':'반복 복습 목록에 추가했어요.'):'표시를 해제했어요.');}
const checklist=['경험과 앞으로의 계획을 구분했어요','직접 한 일과 상의한 일을 나눠 말했어요','짧은 문장과 공손한 말투로 말했어요','미확인 내용을 임의로 채우지 않았어요'];
function checksHTML(id,practice=false){const values=state.checks[id]||[];return `<div class="checklist">${checklist.map((t,i)=>`<label><input type="checkbox" data-check="${id}" data-index="${i}" ${values[i]?'checked':''}>${t}</label>`).join('')}</div>${practice?'':'<p class="tiny">직접 소리 내어 연습한 뒤 체크해 주세요. 자동 음성 평가는 제공하지 않습니다.</p>'}`;}
function reviewed(id){state.reviews[id]={count:(state.reviews[id]?.count||0)+1,at:new Date().toISOString()};save();render();toast('복습 기록을 남겼어요. 목록에는 계속 남아 있어요.');}
function heading(title,desc,extra=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`;}
function sourceHTML(q){return q.source.map(id=>{const s=SOURCES.find(x=>x.id===id);return `<p><b>${esc(s.title)}</b><br>${esc(s.text)}<br><span class="tiny">${esc(s.where)} · 원문 내용 요약</span></p>`;}).join('')+(q.review?`<p><b>질문 출처 · ${esc(REVIEW_META.title)}</b><br>${esc(REVIEW_META.grade)}<br>${esc(REVIEW_META.note)}<br><a href="${REVIEW_META.url}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">후기 원문 ↗</a></p>`:'')+(q.id==='expanded-06'?`<p>${esc(MND_ROLE_SOURCE.note)}<br><a href="${MND_ROLE_SOURCE.url}" target="_blank" rel="noopener noreferrer">${esc(MND_ROLE_SOURCE.title)} ↗</a></p>`:'');}
function questionHTML(q,open=false){const a=effective(q),f=flag(q.id);return `<details class="qa" id="q-${q.id}" ${open?'open':''}><summary><span class="number">${String(QUESTIONS.indexOf(q)+1).padStart(2,'0')}</span><div class="qa-title"><div class="legend"><span class="tag gray">${CATEGORIES[q.cat]}</span><span class="tag ${q.review?'blue':q.origin==='경채 대비 예상'?'amber':'gray'}">${esc(q.origin||'경력 기반 연습')}</span><span class="tag ${q.type==='상황형'?'blue':''}">${q.type}</span>${f.weak?'<span class="tag amber">보완 필요</span>':''}${state.answers[q.id]?'<span class="tag">내가 수정한 답변</span>':''}</div><h3>${esc(q.title)}</h3></div></summary><div class="qa-content"><span class="eyebrow">${state.answers[q.id]?'MY ANSWER':'ANSWER DRAFT'}</span><div class="answer-box"><p class="answer">${esc(a.answer)}</p></div><div class="role-grid"><div class="role-box"><span class="tag">${(q.isPlan||q.type==='상황형')?'직접 할 일 · 향후 대응':'직접 한 일'}</span><p>${esc(q.direct)}</p></div><div class="role-box"><span class="tag blue">${(q.isPlan||q.type==='상황형')?'상의·보고할 일 · 향후 대응':'전달·상의 / 권한 구분'}</span><p>${esc(q.consult)}</p></div></div><div class="unknown"><b>미확인</b> · ${esc(q.unknown)}</div><div class="follow"><h4 class="small">이어질 수 있는 질문 <span class="muted">2개</span></h4>${q.follow.map((v,i)=>`<details><summary>Q. ${esc(v[0])}</summary><p>${esc(a.follow[i])}</p></details>`).join('')}</div><details class="source-compare"><summary>경력·계획 근거 / 질문 출처 펼쳐보기</summary>${sourceHTML(q)}</details><div class="actions"><button class="btn small primary" data-edit="${q.id}">답변 수정</button><button class="btn small" data-one="${q.id}">말하기 연습</button><button class="btn small warn ${f.weak?'active':''}" aria-pressed="${!!f.weak}" data-flag="weak" data-id="${q.id}">${f.weak?'✓ ':''}부족한 답변</button><button class="btn small ${f.review?'active':''}" aria-pressed="${!!f.review}" data-flag="review" data-id="${q.id}">${f.review?'✓ ':''}반복 복습</button>${(f.review||f.weak)?`<button class="btn small" data-reviewed="${q.id}">오늘 복습 완료</button>`:''}</div>${state.notes[q.id]?`<div class="note">보완 메모 · ${esc(state.notes[q.id])}</div>`:''}</div></details>`;}
function filtered(){const s=filter.search.trim().toLowerCase();return QUESTIONS.filter(q=>(filter.cat==='all'||q.cat===Number(filter.cat))&&(filter.origin==='all'||q.origin===filter.origin)&&(filter.type==='all'||q.type===filter.type)&&(filter.status==='all'||(filter.status==='weak'?flag(q.id).weak:filter.status==='review'?flag(q.id).review:filter.status==='edited'?!!state.answers[q.id]:false))&&(!s||[q.title,effective(q).answer,...q.follow.flat(),...effective(q).follow,q.direct,q.consult,q.origin,CATEGORIES[q.cat],state.notes[q.id]].join(' ').toLowerCase().includes(s)));}

function questionsPage(openId){const rows=filtered();return heading('질문·답변 노트','짧고 공손하게 말하는 답변 초안. 펼쳐서 근거와 꼬리질문을 확인해요.')+`<div class="notice bank-notice"><b>총 ${QUESTIONS.length}문항 · 출처별로 구분해 보기</b><br>기존 경력 기반 질문에 더해, 사용자가 제공한 육군 행정 9급 면접 오픈자료의 응시 사례와 면접 준비 가이드 질문을 추가했습니다. 실제 응시 사례와 자료 기반 대비 질문은 구분해서 표시합니다.<div class="actions"><button class="btn small" data-origin="육군 행정 9급 자료 수록">육군 행정 9급 자료 질문 보기</button><button class="btn small" data-origin="면접 준비자료 기반">면접 준비 가이드 질문 보기</button><button class="btn small" data-origin="all">전체 보기</button></div></div>`+toolbar()+`<div class="result-line"><span>질문 <b>${rows.length}</b>개 · 꼬리질문 ${rows.length*2}개</span><button class="text-btn" id="resetFilters">필터 초기화</button></div><div id="questionList">${rows.length?rows.map(q=>questionHTML(q,q.id===openId)).join(''):'<div class="empty">일치하는 질문이 없어요. 다른 키워드나 분야를 선택해 주세요.</div>'}</div>`;}
function reviewPage(){let qs=QUESTIONS.filter(q=>flag(q.id).weak||flag(q.id).review).sort((a,b)=>Number(!!flag(b.id).weak)-Number(!!flag(a.id).weak)||(state.reviews[a.id]?.at||'').localeCompare(state.reviews[b.id]?.at||''));return heading('다시 말하면, 더 익숙해져요.','부족한 답변과 반복 복습에 담아둔 질문을 모았어요.',`<button class="btn primary" id="reviewPractice" ${!qs.length?'disabled':''}>이 목록으로 연습 ↗</button>`)+`<div class="notice" style="margin:0 0 22px">부족한 답변을 먼저, 그다음 오래 복습하지 않은 질문부터 보여줘요. ‘오늘 복습 완료’를 눌러도 목록은 유지됩니다.</div>${qs.length?qs.map(q=>`<div class="study-count"><span>${flag(q.id).weak?'보완 필요':'반복 복습'}</span><span>${state.reviews[q.id]?.at?`${state.reviews[q.id].count}회 복습 · 최근 ${dateTime(state.reviews[q.id].at)}`:'아직 복습 기록 없음'}</span></div>${questionHTML(q)}`).join(''):'<div class="empty"><h3>내가 다시 볼 질문만, 여기에.</h3><p>질문 노트에서 ‘부족한 답변’ 또는 ‘반복 복습’을 눌러보세요.</p><a class="btn" style="margin-top:20px" href="#questions">질문 고르기 →</a></div>'}`;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newSession(ids){stopTimer();elapsed=0;session={ids:[...ids],index:0,reveal:false,items:[],followShown:[false,false],complete:false};location.hash='practice';render();window.scrollTo(0,0);}
function practicePage(){if(!session)return heading('말로 꺼내보는 연습','답변을 먼저 가리고, 내 말로 답한 뒤 초안과 비교해보세요.')+`<div class="practice-grid"><section class="card practice-card"><div class="eyebrow">MOCK INTERVIEW</div><h2>완벽한 문장보다,<br>내 경험을 정확하게.</h2><p class="muted">분야와 문항 수를 고르면 중복 없이 질문을 뽑아드려요.<br>1분 타이머는 연습용이며 실제 면접 제한시간은 미확인입니다.</p><hr class="divider"><div class="practice-config"><label for="practiceCategory">분야</label><select id="practiceCategory"><option value="all">모든 분야</option>${CATEGORIES.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select><label for="practiceOrigin">출처</label><select id="practiceOrigin"><option value="all">모든 출처</option><option>경채 후기 확인</option><option>경채 대비 예상</option><option>경력 기반 연습</option><option>육군 행정 9급 자료 수록</option><option>면접 준비자료 기반</option></select><label for="practiceCount">문항 수</label><select id="practiceCount"><option value="3">3개</option><option value="5" selected>5개</option><option value="10">10개</option></select></div><label class="small"><input type="checkbox" id="weakOnly"> 부족한 답변만 선택</label><div style="margin-top:25px"><button class="btn primary" id="startPractice">질문 뽑고 시작하기 ↗</button></div></section><aside class="card"><span class="eyebrow">PRACTICE NOTE</span><h3 style="margin:14px 0">연습은 이렇게.</h3><p class="muted small">① 질문을 읽고 타이머 시작<br>② 소리 내어 답변하기<br>③ 초안·역할 구분·꼬리질문 확인<br>④ 말하기 체크 후 다음 질문</p><div class="notice">녹음이나 음성 수집 없이 직접 체크하는 연습입니다.</div></aside></div>${sessionHistory()}`;
if(session.complete){const n=session.items.length;return heading('한 번 더, 자신 있어졌어요.','이번 연습을 마쳤어요. 보완할 답변은 반복 복습에 담아두세요.')+`<div class="session-result"><span class="eyebrow">SESSION COMPLETE</span><h2 style="margin:12px 0">${n}개 질문을 연습했어요.</h2><p class="small muted">연습 기록은 이 브라우저에 저장됩니다.</p></div><div class="list-card">${listRows(session.ids)}</div><div class="actions"><button class="btn primary" id="restartPractice">새 질문으로 다시 연습</button><a class="btn" href="#review">복습 목록 보기</a></div>${sessionHistory()}`;}
const q=getQ(session.ids[session.index]),a=effective(q);return heading('한 질문씩, 차분하게.','모르는 내용을 채우기보다 확인할 부분을 구분해서 말해요.',`<button class="btn small" id="endPractice">연습 종료</button>`)+`<div class="practice-grid"><section class="card practice-card"><div class="section-head"><span class="tag gray">${CATEGORIES[q.cat]} · ${q.type}</span><span class="small muted">${session.index+1} / ${session.ids.length}</span></div><div class="progress"><div style="width:${(session.index+1)/session.ids.length*100}%"></div></div><h2>${esc(q.title)}</h2>${!session.reveal?'<div class="empty" style="border:0;background:#f5f7f0;padding:28px 20px"><p>먼저 내 말로 답해보세요.</p><button class="btn" id="revealAnswer" style="margin-top:17px">답변·꼬리질문 확인</button></div>':`<div class="answer-box"><p class="answer">${esc(a.answer)}</p></div><div class="role-grid"><div class="role-box"><span class="tag">${q.type==='상황형'?'직접 할 일 · 계획':'직접 한 일'}</span><p>${esc(q.direct)}</p></div><div class="role-box"><span class="tag blue">전달·상의 / 권한 구분</span><p>${esc(q.consult)}</p></div></div><div class="unknown">미확인 · ${esc(q.unknown)}</div>${q.follow.map((f,i)=>`<div class="follow-practice"><b class="small">꼬리질문 ${i+1}</b><p>${esc(f[0])}</p>${session.followShown[i]?`<p style="color:#5e7c55">${esc(a.follow[i])}</p>`:`<button class="text-btn" data-showfollow="${i}">꼬리답변 보기 →</button>`}</div>`).join('')}`}<div class="actions"><button class="btn small" data-edit="${q.id}">답변 수정</button><button class="btn small warn ${flag(q.id).weak?'active':''}" data-flag="weak" data-id="${q.id}" aria-pressed="${!!flag(q.id).weak}">부족한 답변</button><button class="btn small ${flag(q.id).review?'active':''}" data-flag="review" data-id="${q.id}" aria-pressed="${!!flag(q.id).review}">반복 복습</button><button class="btn small primary" id="nextQuestion">${session.index+1===session.ids.length?'기록하고 마치기':'기록하고 다음 질문 →'}</button></div></section><aside class="practice-aside"><div class="card timer-card"><span class="eyebrow">SPEAK AT YOUR PACE</span><div class="timer" id="timerValue">${timerText()}</div><div class="timer-controls"><button class="btn small primary" id="timerToggle">${timerStart?'일시정지':'시작'}</button><button class="btn small" id="timerReset">초기화</button></div><label class="small" style="display:block;margin-top:15px">연습 목표 <select id="timerTarget" aria-label="연습 목표 시간"><option value="60" ${targetSeconds===60?'selected':''}>1분</option><option value="90" ${targetSeconds===90?'selected':''}>1분 30초</option><option value="120" ${targetSeconds===120?'selected':''}>2분</option></select></label><p id="timerStatus" class="tiny" style="margin-top:12px">${totalTime()>=targetSeconds?'목표 시간에 도달했어요.':'답변 시간은 직접 재는 연습용입니다.'}</p></div><div class="card" style="margin-top:18px"><h3>말하기 체크</h3>${checksHTML(q.id,true)}<p class="tiny">자동 평가는 아니에요. 직접 말한 뒤 체크해요.</p></div></aside></div>`;}
function timerText(){const s=totalTime();return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function totalTime(){return elapsed+(timerStart?Math.floor((Date.now()-timerStart)/1000):0);}
function stopTimer(){if(timerStart){elapsed=totalTime();timerStart=null;}clearInterval(timerInterval);timerInterval=null;}
function tick(){if($('#timerValue'))$('#timerValue').textContent=timerText();if($('#timerStatus'))$('#timerStatus').textContent=totalTime()>=targetSeconds?'목표 시간에 도달했어요. 천천히 마무리하세요.':'답변 시간은 직접 재는 연습용입니다.';}
function toggleTimer(){if(timerStart)stopTimer();else{timerStart=Date.now();timerInterval=setInterval(tick,300);}$('#timerToggle').textContent=timerStart?'일시정지':'시작';tick();}
function finishSession(){stopTimer();if(!session||session.complete)return;if(session.items.length){state.sessions.unshift({at:new Date().toISOString(),items:session.items});state.sessions=state.sessions.slice(0,100);save();}session.complete=true;render();}
function sessionHistory(){return state.sessions.length?`<div style="margin-top:28px"><div class="section-head"><h2>최근 말하기 기록</h2><span class="tiny">최근 5회</span></div>${state.sessions.slice(0,5).map(s=>`<div class="history-item"><time>${dateTime(s.at)}</time><div class="small" style="margin-top:6px">${s.items.length}개 연습 · 총 ${s.items.reduce((n,x)=>n+(Number(x.seconds)||0),0)}초 측정</div><div class="tiny">${s.items.map(x=>esc(getQ(x.id)?.title)).join(' / ')}</div></div>`).join('')}</div>`:'';}
function fingerprint(q){return JSON.stringify(effective(q));}
function riskWarnings(q){const a=effective(q),text=[a.answer,...a.follow].join('\n');const rules=[[/VLOOKUP|XLOOKUP|SUMIF|COUNTIF|피벗|매크로|엑셀\s*자동화/i,'사용한 엑셀 세부 기능이 실제로 확인되었는지 확인해 주세요.'],[/접수대장|관리대장|대장에|대장을/,'대장의 실제 사용 여부와 형식은 미확인입니다.'],[/최종\s*(심사|승인|결정)|심사\s*권한|승인\s*권한/,'신청·전산등록과 최종 심사·승인 권한을 구분해 주세요.'],[/계약\s*만료|퇴사|퇴직|근무\s*종료|그만두/,'이전 근무 종료 사유는 미확인입니다.'],[/면접.{0,15}(일정|방식|발표|날짜)|\d{1,2}월\s*\d{1,2}일/,'공식 면접 방식·일정은 공고 확인 전까지 미확인입니다.'],[/총괄|기획했|예산.*(집행|관리)|\d+명/,'운영보조를 넘는 권한이나 확인되지 않은 규모·수치가 없는지 확인해 주세요.']];return rules.filter(([re])=>re.test(text)).map(x=>x[1]);}
function documentsPage(){const done=QUESTIONS.filter(q=>state.audits[q.id]?.fingerprint===fingerprint(q)).length;return heading('서류와 같은 경험, 같은 답변.','제출 자기소개서·직무수행계획서의 확인된 내용과 나란히 점검해요.')+`<div class="card"><div class="section-head"><h2>점검 기준</h2><span class="tag">${done} / ${QUESTIONS.length}개 대조 완료</span></div><p class="audit-scan-note">아래 근거는 제출했던 「육군 일반군무원 경력경쟁채용 이력서.pdf」 중 자기소개서·직무수행계획서의 내용 요약입니다. 경력증명서와 원본 이력서의 정확한 기간·기관명은 별도 대조가 필요합니다. 자동 점검은 주의할 표현만 찾으며, 서류 일치 여부를 확정하지 않습니다.</p><div class="legend" style="margin-top:15px">${UNKNOWNS.map(t=>`<span class="tag amber">미확인 · ${esc(t)}</span>`).join('')}</div><hr class="divider"><details><summary class="small" style="cursor:pointer">최신 제출서류 내용을 붙여넣어 추가 대조하기</summary><label class="form-label" for="documentText">제출한 문구 그대로 붙여넣기 · 개인정보는 필요한 부분만</label><textarea id="documentText" rows="7" maxlength="100000" placeholder="최신 서류와 대조할 부분을 붙여넣으세요. 이 브라우저에만 저장됩니다.">${esc(state.documentText)}</textarea><button class="btn small" id="saveDocument">서류 메모 저장</button><p class="tiny">추가 원문은 아래 각 질문의 비교 영역에도 표시됩니다. 원문을 바꾸면 모든 대조 완료 체크가 풀립니다.</p></details></div><div class="section-head" style="margin-top:27px"><h2>질문별 불일치 점검</h2><button class="btn small" id="scanAnswers">주의 표현 점검 ↻</button></div><p class="tiny" style="margin-bottom:16px">현재 답변과 꼬리답변에서 키워드를 찾아요. 부정·미확인 설명도 탐지될 수 있으니 근거를 보고 직접 판단해 주세요. 답변이 바뀌면 대조 완료 체크가 풀립니다.</p><div id="auditResults">${auditRows()}</div><div class="section-head" style="margin-top:30px"><h2>확인된 경력·계획 기준표</h2></div><div class="check-source">${SOURCES.map(s=>`<article class="source-card"><h3>${esc(s.title)}</h3><small>${esc(s.where)}</small><p>${esc(s.text)}</p></article>`).join('')}</div><div class="notice"><b>카페 후기 참고 · ${CAFE_REFERENCE.date}</b><br>${esc(CAFE_REFERENCE.note)}<br><a href="${CAFE_REFERENCE.url}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">${esc(CAFE_REFERENCE.title)} 원문 보기 ↗</a></div>`;}
function auditRows(){return QUESTIONS.map(q=>{const warnings=riskWarnings(q),checked=state.audits[q.id]?.fingerprint===fingerprint(q);return `<article class="audit-item"><div class="section-head" style="margin-bottom:6px"><strong>${esc(q.title)}</strong><span class="tag ${checked?'':'gray'}">${checked?'직접 대조 완료':'직접 대조 필요'}</span></div>${warnings.length?`<p>${warnings.map(w=>'• '+esc(w)).join('<br>')}</p>`:'<p>주의 키워드가 탐지되지 않았어요. 실제 경험과의 일치는 직접 대조해 주세요.</p>'}<details><summary class="small" style="cursor:pointer">현재 답변·서류 근거 나란히 보기</summary><div class="history-diff" style="margin-top:12px"><div><span class="tag">현재 답변</span><p class="source-text">${esc(effective(q).answer)}</p>${q.follow.map((f,i)=>`<p><b>${esc(f[0])}</b><br>${esc(effective(q).follow[i])}</p>`).join('')}</div><div><span class="tag blue">제출서류 근거 요약</span>${sourceHTML(q)}${state.documentText?`<hr class="divider"><b class="small">추가한 최신 서류 원문</b><p class="source-text">${esc(state.documentText)}</p>`:''}</div></div><div class="unknown">미확인 · ${esc(q.unknown)}</div><button class="btn small" data-edit="${q.id}">이 답변 수정</button></details><label style="margin-top:12px"><input type="checkbox" data-audit="${q.id}" ${checked?'checked':''}> 직접 수행·전달/상의·미확인 내용과 서류를 대조했어요</label></article>`;}).join('');}
function dateTime(d){const n=new Date(d);return Number.isNaN(n.getTime())?'날짜 미확인':new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(n);}
function historyPage(){return heading('조금씩 다듬은 흔적','답변과 꼬리답변, 보완 메모의 최근 수정 100건을 남겨요.')+`<div class="notice" style="margin:0 0 22px">예전 답변으로 되돌려도 복원 자체가 새로운 이력으로 남습니다. 체크·복습 기록은 백업 파일에 함께 담깁니다.</div>${state.history.length?state.history.map((h,i)=>`<article class="history-item"><div class="section-head"><h3>${esc(getQ(h.id)?.title||h.id)}</h3><span class="tag gray">${esc(h.action||'답변 수정')}</span></div><time>${dateTime(h.at)}</time><details><summary>변경 전·후 펼쳐보기</summary><div class="history-diff"><div><p><b>변경 전</b><br>${esc(h.before.answer)}</p>${h.before.follow.map((f,k)=>`<p>꼬리답변 ${k+1}<br>${esc(f)}</p>`).join('')}<p>메모 · ${esc(h.before.note||'없음')}</p></div><div><p><b>변경 후</b><br>${esc(h.after.answer)}</p>${h.after.follow.map((f,k)=>`<p>꼬리답변 ${k+1}<br>${esc(f)}</p>`).join('')}<p>메모 · ${esc(h.after.note||'없음')}</p></div></div><button class="btn small" data-restore="${i}">이 변경 전 답변으로 복원</button></details></article>`).join(''):'<div class="empty"><h3>아직 수정한 답변이 없어요.</h3><p>질문 노트에서 내 말로 답변을 다듬어보세요.</p></div>'}${backups()}`;}
function openEditor(id){const q=getQ(id);editing=id;const a=effective(q);$('#editorTitle').textContent=q.title;$('#answerInput').value=a.answer;$('#noteInput').value=state.notes[id]||'';$('#editorFollow').innerHTML=q.follow.map((f,i)=>`<label>${esc(f[0])}<textarea id="followInput${i}" rows="2" maxlength="2000">${esc(a.follow[i])}</textarea></label>`).join('');$('#editor').showModal();}
function storeAnswer(id,newValue,action){const q=getQ(id),before={...effective(q),follow:[...effective(q).follow],note:state.notes[id]||''},after={answer:newValue.answer,follow:[...newValue.follow],note:newValue.note||''};if(JSON.stringify(before)===JSON.stringify(after))return false;state.history.unshift({id,at:new Date().toISOString(),before,after,action});state.history=state.history.slice(0,100);state.answers[id]={answer:after.answer,follow:after.follow};state.notes[id]=after.note;delete state.audits[id];save();return true;}
function render(){const [page,id]=(location.hash.slice(1)||'home').split('/');document.body.classList.toggle('large',state.fontLarge);$$('nav a').forEach(a=>{const active=a.dataset.page===page;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});$('#reviewBadge').textContent=QUESTIONS.filter(q=>flag(q.id).review||flag(q.id).weak).length;const content=page==='questions'?questionsPage(id):page==='practice'?practicePage():page==='review'?reviewPage():page==='documents'?documentsPage():page==='history'?historyPage():home();$('#main').innerHTML=(storageError?'<div class="storage-alert" role="alert">브라우저 저장공간을 읽거나 저장하지 못했어요. 수정 기록은 백업 파일로 내려받아 주세요.</div>':'')+content;bind();if(page==='practice'&&timerStart)tick();}
function bind(){const on=(s,fn)=>{const el=$(s);if(el)el.addEventListener('click',fn);};$$('[data-open]').forEach(el=>el.onclick=()=>{filter={cat:'all',type:'all',search:'',status:'all',origin:'all'};const hash='questions/'+el.dataset.open;if(location.hash.slice(1)===hash)render();else location.hash=hash;setTimeout(()=>document.getElementById('q-'+el.dataset.open)?.scrollIntoView({block:'start',behavior:'smooth'}),20);});$$('[data-edit]').forEach(el=>el.onclick=()=>openEditor(el.dataset.edit));$$('[data-one]').forEach(el=>el.onclick=()=>newSession([el.dataset.one]));$$('[data-flag]').forEach(el=>el.onclick=()=>{const details=$$('.qa[open]').map(x=>x.id);toggleFlag(el.dataset.id,el.dataset.flag);details.forEach(id=>{const x=document.getElementById(id);if(x)x.open=true;});});$$('[data-reviewed]').forEach(el=>el.onclick=()=>reviewed(el.dataset.reviewed));$$('[data-check]').forEach(el=>el.onchange=()=>{const id=el.dataset.check;state.checks[id]=Array.from({length:4},(_,i)=>state.checks[id]?.[i]||false);state.checks[id][Number(el.dataset.index)]=el.checked;save();});$$('[data-audit]').forEach(el=>el.onchange=()=>{const q=getQ(el.dataset.audit);if(el.checked)state.audits[q.id]={at:new Date().toISOString(),fingerprint:fingerprint(q)};else delete state.audits[q.id];save();render();});$$('[data-origin]').forEach(el=>el.onclick=()=>{filter={cat:'all',type:'all',search:'',status:'all',origin:el.dataset.origin};location.hash='questions';render();});$$('[data-cat]').forEach(el=>el.onclick=()=>{filter.cat=el.dataset.cat;render();});const search=$('#searchInput');if(search)search.oninput=()=>{filter.search=search.value;const start=search.selectionStart;render();$('#searchInput').focus();$('#searchInput').setSelectionRange(start,start);};for(const [selector,key] of [['#typeFilter','type'],['#statusFilter','status'],['#originFilter','origin']]){if($(selector))$(selector).onchange=e=>{filter[key]=e.target.value;render();};}on('#resetFilters',()=>{filter={cat:'all',type:'all',search:'',status:'all',origin:'all'};render();});on('#fontToggle',()=>{state.fontLarge=!state.fontLarge;save();render();});$$('[data-homecat]').forEach(el=>el.onclick=()=>{filter={cat:el.dataset.homecat,type:'all',search:'',status:'all',origin:'all'};location.hash='questions';render();});on('#quickStart',()=>newSession(shuffle(QUESTIONS).slice(0,5).map(q=>q.id)));on('#reviewPractice',()=>newSession(shuffle(QUESTIONS.filter(q=>flag(q.id).review||flag(q.id).weak)).map(q=>q.id)));on('#startPractice',()=>{const cat=$('#practiceCategory').value,weak=$('#weakOnly').checked;const origin=$('#practiceOrigin').value;const pool=QUESTIONS.filter(q=>(cat==='all'||q.cat===Number(cat))&&(origin==='all'||q.origin===origin)&&(!weak||flag(q.id).weak));if(!pool.length)return toast('선택 조건에 해당하는 질문이 없어요.');newSession(shuffle(pool).slice(0,Number($('#practiceCount').value)).map(q=>q.id));});on('#revealAnswer',()=>{session.reveal=true;render();});$$('[data-showfollow]').forEach(el=>el.onclick=()=>{session.followShown[Number(el.dataset.showfollow)]=true;render();});on('#timerToggle',toggleTimer);on('#timerReset',()=>{stopTimer();elapsed=0;render();});if($('#timerTarget'))$('#timerTarget').onchange=e=>{targetSeconds=Number(e.target.value);tick();};on('#nextQuestion',()=>{stopTimer();session.items.push({id:session.ids[session.index],seconds:elapsed,checks:[...(state.checks[session.ids[session.index]]||[])]});reviewedSilently(session.ids[session.index]);elapsed=0;if(session.index+1===session.ids.length)finishSession();else{session.index++;session.reveal=false;session.followShown=[false,false];render();window.scrollTo(0,0);}});on('#endPractice',()=>{if(confirm('현재 질문은 기록하지 않고 연습을 마칠까요?')){if(session.items.length)finishSession();else{stopTimer();session=null;render();}}});on('#restartPractice',()=>{session=null;render();});on('#saveDocument',()=>{const v=$('#documentText').value;if(v!==state.documentText){state.documentText=v;state.audits={};save();render();toast('서류 메모를 저장했어요. 다시 대조해 주세요.');}else toast('저장된 서류 메모와 같아요.');});on('#scanAnswers',()=>{render();toast('현재 답변과 꼬리답변의 주의 표현을 다시 확인했어요.');});$$('[data-restore]').forEach(el=>el.onclick=()=>{const h=state.history[Number(el.dataset.restore)];if(confirm('현재 답변 대신 이 변경 전 답변을 불러올까요?')){storeAnswer(h.id,h.before,'이전 답변 복원');render();toast('이전 답변으로 복원했어요.');}});on('#exportData',exportData);on('#importData',()=>$('#importFile').click());on('#clearData',()=>{if(confirm('이 브라우저의 수정·체크·복습 기록을 초기화할까요? 필요한 기록은 먼저 백업해 주세요.')){stopTimer();session=null;state=initial();save();render();toast('이 브라우저의 연습 기록을 초기화했어요.');}});}
function reviewedSilently(id){state.reviews[id]={count:(state.reviews[id]?.count||0)+1,at:new Date().toISOString()};save();}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='calm-interview-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('개인 답변과 서류 메모가 포함된 백업 파일이에요.');}
$('#saveAnswer').onclick=()=>{const answer=$('#answerInput').value.trim(),follow=[$('#followInput0').value.trim(),$('#followInput1').value.trim()];if(!answer||follow.some(x=>!x))return toast('답변과 두 꼬리답변을 모두 작성해 주세요.');const changed=storeAnswer(editing,{answer,follow,note:$('#noteInput').value.trim()},'답변 수정');$('#editor').close();render();toast(storageError?'현재 화면에만 반영했어요. 저장공간 오류로 백업이 필요해요.':changed?'답변을 저장했어요. 수정 이력에서도 확인할 수 있어요.':'변경된 내용이 없어요.');};
$('#restoreDefault').onclick=()=>{if(!editing)return;const q=getQ(editing);$('#answerInput').value=q.answer;q.follow.forEach((f,i)=>$('#followInput'+i).value=f[1]);toast('기본 초안을 불러왔어요. 저장하면 반영됩니다.');};
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('5MB 이하의 백업 파일을 선택해 주세요.');const next=validate(JSON.parse(await file.text()));if(!confirm('이 브라우저의 답변·복습 기록을 백업 내용으로 바꿀까요? 현재 기록이 필요하면 먼저 내보내 주세요.'))return;stopTimer();session=null;state=next;save();render();toast('백업을 불러왔어요.');}catch(err){toast(err.message||'백업 파일을 읽지 못했어요.');}finally{e.target.value='';}};
window.addEventListener('hashchange',()=>{stopTimer();render();window.scrollTo(0,0);});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const next=validate(JSON.parse(e.newValue));if($('#editor').open){toast('다른 탭에서 기록이 바뀌었어요. 편집 내용을 저장하기 전에 백업해 주세요.');return;}state=next;render();}catch{toast('다른 탭의 데이터를 읽지 못했어요.');}}});
window.addEventListener('beforeunload',e=>{if($('#editor').open){const q=getQ(editing),a=effective(q);if($('#answerInput').value!==a.answer||$('#followInput0').value!==a.follow[0]||$('#followInput1').value!==a.follow[1]||$('#noteInput').value!==(state.notes[editing]||'')){e.preventDefault();e.returnValue='';}}});
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){storageError=true;}
render();

</script></body></html>
